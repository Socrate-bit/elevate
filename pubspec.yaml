name: elevate
description: "Skeleton Flutter app — auth, onboarding, subscription, streaks."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  ## CORE
  flutter_bloc: ^9.1.1
  equatable: ^2.0.8
  flutter_native_splash: ^2.4.7
  flutter_launcher_icons: ^0.14.4

  ## TEST
  mocktail: ^1.0.5
  bloc_test: ^10.0.0

  ## AUTH
  firebase_auth: ^6.3.0
  google_sign_in: ^7.2.0
  sign_in_with_apple: ^7.0.1

  ## LOCALIZATION
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  ## STORAGE
  firebase_core: ^4.6.0
  cloud_firestore: ^6.2.0
  cloud_functions: ^6.2.0
  shared_preferences: ^2.5.5
  path_provider: ^2.1.5

  ## SUBSCRIPTION + ANALYTICS
  superwallkit_flutter: ^2.4.11
  posthog_flutter: ^5.2.0

  ## UI / UX
  flutter_screenutil: ^5.9.3
  device_preview: ^1.3.1
  uuid: ^4.5.1
  liquid_glass_bar:
    path: packages/liquid_glass_bar
  crypto: ^3.0.7
  confetti: ^0.8.0
  url_launcher: ^6.3.1
  in_app_review: ^2.0.11
  time_picker_spinner: ^1.0.2
  signature: ^6.3.0

  ## FEATURES
  firebase_ai: ^3.11.0
  speech_to_text: ^7.3.0
  camera: ^0.11.1
  google_mlkit_pose_detection: ^0.14.0
  shake: ^2.2.0
  liquid_glass_widgets: ^0.15.7
  video_player: ^2.11.1
  flutter_local_notifications: ^22.1.0
  timezone: ^0.11.1
  flutter_timezone: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: false
  ios: true
  image_path: "assets/app_icon.png"
  macos:
    generate: true
    image_path: "assets/app_icon.png"

flutter_native_splash:
  color: "#FFFFFF"
  image: assets/app_icon.png
  android: false
  ios: true

flutter:
  generate: true
  assets:
    - shorebird.yaml
    - assets/home/
    - assets/home_page/
    - assets/activities/
    - assets/chat/
    - assets/journal/
    - assets/mood tracking/
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/Nunito-VariableFont_wght.ttf
